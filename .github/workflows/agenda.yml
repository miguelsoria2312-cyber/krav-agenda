name: Agenda Krav Maga

on:
  schedule:
    # Horários em UTC. Brasília = UTC-3.
    # 16:55 e 17:25 de segunda e quarta (a lista abre às 17:30).
    # Duas execuções porque o GitHub às vezes atrasa o agendamento;
    # a segunda só age se a primeira não tiver inscrito.
    - cron: "55 19 * * 1,3"
    - cron: "25 20 * * 1,3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Teste (não clica em Agendar)"
        type: boolean
        default: true
      force:
        description: "Rodar mesmo que amanhã não seja terça/quinta"
        type: boolean
        default: false

concurrency:
  group: agenda-krav
  cancel-in-progress: false

jobs:
  agendar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Inscrever
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
          MAX_MINUTOS: "60"
        run: python agendar.py
